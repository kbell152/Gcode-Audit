[pytest]
# Where pytest looks for test files
testpaths = tests

# File / class / function naming conventions for test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting:
#   -v          verbose (one line per test with name and result)
#   --tb=short  shorter tracebacks on failure (full path noise stripped)
#   -ra         summary at the end listing skipped/failed/errored tests
addopts = -v --tb=short -ra
